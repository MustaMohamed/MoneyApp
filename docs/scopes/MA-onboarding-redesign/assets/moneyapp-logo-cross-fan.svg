<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">MoneyApp Cross Fan logo</title>
  <desc id="description">
    Three angled account cards in midnight blue, blue, and gold with a folded
    MoneyApp mark and a small teal accent.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="80"
      y1="80"
      x2="944"
      y2="944"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#192B3F" />
      <stop offset="0.7" stop-color="#0F1923" />
      <stop offset="1" stop-color="#0F1923" />
    </linearGradient>
    <clipPath id="icon-tile">
      <rect x="80" y="80" width="864" height="864" rx="204" />
    </clipPath>
    <linearGradient id="back-card" x1="28" y1="18" x2="100" y2="69">
      <stop offset="0" stop-color="#344A67" />
      <stop offset="1" stop-color="#213149" />
    </linearGradient>
    <linearGradient id="middle-card" x1="23" y1="31" x2="101" y2="85">
      <stop offset="0" stop-color="#63B6F0" />
      <stop offset="1" stop-color="#377FB8" />
    </linearGradient>
    <linearGradient id="front-card" x1="17" y1="45" x2="103" y2="103">
      <stop offset="0" stop-color="#E8C878" />
      <stop offset="1" stop-color="#C68F32" />
    </linearGradient>
    <filter id="card-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3.5"
        flood-color="#050B11"
        flood-opacity="0.32"
      />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#050B11" />
  <rect
    x="80"
    y="80"
    width="864"
    height="864"
    rx="204"
    fill="url(#background)"
    stroke="#E0B968"
    stroke-opacity="0.3"
    stroke-width="6"
  />
  <g transform="translate(170 170) scale(5.7)" filter="url(#card-shadow)">
    <rect
      x="28"
      y="18"
      width="72"
      height="51"
      rx="15"
      fill="url(#back-card)"
      transform="rotate(8 64 43.5)"
    />
    <rect
      x="23"
      y="31"
      width="78"
      height="54"
      rx="16"
      fill="url(#middle-card)"
      transform="rotate(-8 62 58)"
    />
    <g transform="rotate(1.5 60 74)">
      <rect x="17" y="45" width="86" height="58" rx="17" fill="url(#front-card)" />
      <path
        d="M37 88V64c0-4 5-6 8-3l15 16 15-16c3-3 8-1 8 3v24"
        fill="none"
        stroke="#0F1923"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="9"
      />
      <rect x="84" y="55" width="9" height="9" rx="4.5" fill="#4DBB93" />
    </g>
  </g>
</svg>

name: PR Checks

on:
  # No branch filter: stacked PRs target a stack branch, and [main] silently gives them zero checks.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The `install` job primes the node_modules cache once; every other job
# `needs: install` and restores it via ./.github/actions/setup. On a cold cache
# (lockfile change) this keeps `npm ci` to a single run instead of letting all
# jobs reinstall in parallel — at the cost of a short serial gate before the
# checks start.
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Restore tsc incremental cache
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-
      - run: npm run typecheck -- --incremental --tsBuildInfoFile .tsbuildinfo

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Log oxlint version (type-aware enabled)
        run: npx oxlint --version
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Log oxfmt version
        run: npx oxfmt --version
      - run: npm run format:check

  doctor:
    name: Expo doctor
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Pinned: unpinned `npx --yes expo-doctor` auto-upgrades the tool, adding a
      # second drift axis on top of Expo's live requirement table. Bump deliberately.
      - run: npx --yes expo-doctor@1.20.1
        env:
          CI: true

  test:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Restore jest transform cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-
      - run: npm test -- --ci --cacheDirectory .jest-cache

  prebuild-check:
    name: Prebuild dry-run (Android)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npx expo prebuild --no-install --platform android
        env:
          CI: true
      - name: Verify android/ dir was generated
        run: test -d android && echo "prebuild ok"

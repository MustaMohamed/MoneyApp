name: PR Checks

on:
  # No branch filter: stacked PRs target a stack branch, and [main] silently gives them zero checks.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The `install` job primes the node_modules cache once; every other job
# `needs: install` and restores it via ./.github/actions/setup. On a cold cache
# (lockfile change) this keeps `npm ci` to a single run instead of letting all
# jobs reinstall in parallel — at the cost of a short serial gate before the
# checks start.
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Restore tsc incremental cache
        uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-
      - run: npm run typecheck -- --incremental --tsBuildInfoFile .tsbuildinfo

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Log oxlint version (type-aware enabled)
        run: npx oxlint --version
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Log oxfmt version
        run: npx oxfmt --version
      - run: npm run format:check

  doctor:
    name: Expo doctor
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Pinned: unpinned `npx --yes expo-doctor` auto-upgrades the tool, adding a
      # second drift axis on top of Expo's live requirement table. Bump deliberately.
      - run: npx --yes expo-doctor@1.20.1
        env:
          CI: true

  test:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Restore jest transform cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-
      - run: npm test -- --ci --cacheDirectory .jest-cache

  prebuild-check:
    name: Prebuild dry-run (Android)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npx expo prebuild --no-install --platform android
        env:
          CI: true
      - name: Verify android/ dir was generated
        run: test -d android && echo "prebuild ok"

  patch-compile:
    name: Patched React Native compiles (Android)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      # Depth 2 makes HEAD^1 the base tip: HEAD is the PR merge commit, or the squash commit on main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Gate on the patch, the build flag and the React Native version
        id: gate
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD -- patches app.json package.json package-lock.json)"
          echo "$changed"
          if [ -n "$changed" ]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
          else
            echo "compile=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Gradle caches
        if: steps.gate.outputs.compile == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - if: steps.gate.outputs.compile == 'true'
        run: npx expo prebuild --no-install --platform android
        env:
          CI: true
      # The four excluded tasks fetch native archives and build hermesc, which the Java compile never reads.
      - name: Compile the patched React Native (ReactAndroid)
        if: steps.gate.outputs.compile == 'true'
        working-directory: android
        run: |
          ra=:react-native:packages:react-native:ReactAndroid
          ./gradlew --no-daemon "$ra:compileDebugJavaWithJavac" \
            -x "$ra:prepareNative3pDependencies" -x "$ra:preparePrefab" \
            -x "$ra:hermes-engine:buildHermesC" -x "$ra:hermes-engine:prepareHeadersForPrefab"

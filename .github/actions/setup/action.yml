name: Setup
description: >-
  Restore dependencies from a node_modules cache keyed on the lockfile, falling
  back to `npm ci` on a cache miss. Run after actions/checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: npm

    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'patches/**') }}

    - name: Install (cache miss)
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
